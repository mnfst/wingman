# Turns pending changesets into a version bump.
#
# Wingman is never published to a registry. The "release" is the deploy, and
# the only thing that has to move with it is the version in package.json, which
# vite.config.ts bakes into the status bar. So this workflow does exactly one
# thing: whenever main has unreleased changesets, it opens (or updates) a
# "Version Packages" PR that bumps package.json, writes CHANGELOG.md, and
# deletes the changesets it consumed. Merging that PR is the release.
#
# Needs Settings > Actions > General > "Allow GitHub Actions to create and
# approve pull requests" to be on, or the action can't open the PR.

name: Release

permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:

# One version PR at a time. Two runs racing would fight over the same branch.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # changesets reads the history to work out what is unreleased.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: npm run version:packages
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
